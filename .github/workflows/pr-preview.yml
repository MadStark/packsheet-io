name: PR preview

# One preview per pull request, as an uploaded VERSION of the staging Worker rather
# than a deployment of it. `wrangler versions upload` mints a stable URL of the form
# <version>-packsheet-io-staging.packsheet-io.workers.dev and routes no live traffic
# to it: staging.packsheet.io keeps serving whatever was last deployed from the
# staging branch. A preview therefore cannot disturb staging, which the Azure preview
# environments — built against the staging Static Web App — could.
#
# Two consequences worth knowing:
#
#   - There is nothing to tear down. A version is an immutable artifact, not a leased
#     environment; it routes no traffic, costs nothing, and is superseded by the next
#     upload. The old close-the-preview job existed because the Free plan allowed only
#     three concurrent preview environments and a leaked one consumed a slot forever.
#     That limit, and that job, are gone.
#
#   - Preview URLs live on packsheet-io.workers.dev, outside the packsheet.io zone.
#     They have their own Cloudflare Access application so an unlisted visitor is
#     stopped at the edge exactly as on staging.packsheet.io.
#
# What this workflow does NOT do: give the pull request its own database. The plan
# calls for a Supabase branch per PR, which needs the Pro plan; the organisation is on
# Free today. Previews share the staging database until that lands. Nothing here reads
# a database yet, so the gap costs nothing right now — but it is a gap, not an
# oversight.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # to comment the preview URL on the PR

jobs:
  preview:
    name: build and upload preview
    # Fork pull requests get a read-only token and no access to secrets, so this job
    # cannot deploy for them — it would fail on every external contribution, which on a
    # public repository reads as "your PR is broken" to someone who did nothing wrong.
    # Skipped explicitly instead, so the run is green and the reason is in the log.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Same reasoning as the deploy workflows: ci.yml runs on this event too, but
      # nothing makes this job wait for it.
      - run: npm test

      - name: Build
        env:
          # Previews are never indexable. Anything that is not literally "production"
          # yields Disallow: / — so previews are covered by the default, not by a rule
          # that has to be remembered here.
          PUBLIC_SITE_ENV: preview

          # The staging Worker, because that is the one with preview_urls enabled and
          # the one whose settings a preview should be tested against. Production has
          # preview_urls off precisely so this cannot point at it.
          CLOUDFLARE_ENV: staging
        run: npm run build

      - name: Upload preview version
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned to package-lock.json's wrangler. See deploy-staging.yml.
          wranglerVersion: '4.120.0'
          # upload, NOT deploy. `deploy` would point staging.packsheet.io at this pull
          # request's build.
          command: versions upload -c dist/client/wrangler.json

      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.number }}
          # The action surfaces the URL it parsed out of wrangler's output. Empty is
          # treated as a failure rather than commented as a blank link, because a
          # missing URL means the upload did not produce one and the reviewer should
          # not be told to go and look at nothing.
          URL: ${{ steps.preview.outputs.deployment-url }}
        run: |
          set -euo pipefail
          if [ -z "$URL" ]; then
            echo "::error::wrangler did not report a preview URL."
            exit 1
          fi
          gh pr comment "$PR" --edit-last --create-if-none --body \
            "Preview for \`${{ github.event.pull_request.head.sha }}\`: $URL

          Behind Cloudflare Access, same allow-list as staging. Serves \`Disallow: /\`."
