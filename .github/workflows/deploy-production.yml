name: Deploy production

# main is only ever updated by merging staging through a pull request, so a push here
# means a release. Production is the Standard-tier Static Web App.
#
# That promotion uses a merge commit, deliberately. GitHub's other two strategies both
# rewrite commits, which re-creates the change under a new SHA; the branches then
# diverge and the next release fails with an add/add conflict that looks like a content
# problem but is a history one. This happened once, during the PS-7 release. Linear
# history is therefore NOT required on main — it would leave only the two rewriting
# strategies and guarantee the fault returns.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    # Scopes the deployment token to this environment rather than the whole repo,
    # so a workflow running from a fork or a feature branch cannot reach it.
    environment:
      name: production
      url: https://packsheet.io
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Runs here as well as in ci.yml, on purpose. This workflow and CI are both
      # triggered by the same push and neither depends on the other, so a red CI does
      # not stop a deploy — it is not a race that usually resolves safely, it is no
      # gate at all. The required status check protects the merge button; this step is
      # what protects the artifact. Costs ~25s and must stay ahead of the build.
      #
      # This is the last gate before production. Nothing downstream re-checks.
      - run: npm test

      - name: Build
        # PUBLIC_SITE_ENV drives robots.txt. Only the literal string "production"
        # produces an indexable site — see src/pages/robots.txt.ts.
        env:
          PUBLIC_SITE_ENV: production
        run: npm run build

      # Makes the origin refuse anything that did not arrive through Cloudflare, so the
      # permanent public *.azurestaticapps.net hostname stops serving the site. The why
      # is in scripts/write-origin-lock.sh and the README; the constraints that bind
      # THIS file are:
      #
      #   - it must run after Build (dist/ has to exist) and before Deploy (the file has
      #     to be inside the artifact to be uploaded)
      #   - its argument must equal app_location below, or the config is written
      #     somewhere that never ships and the lock silently never applies
      #   - the value reaches the script through the environment, never the script body
      #
      # Production-only on purpose: forwardingGateway requires the Standard plan and
      # staging is deliberately Free, so staging gets no such file. That is the second
      # environment-dependent behaviour in the project, and unlike PUBLIC_SITE_ENV it
      # cannot be reproduced on staging. tests/deploy-origin-lock.test.ts pins all three
      # constraints above.
      - name: Write the production-only origin lock
        env:
          ORIGIN_VERIFY: ${{ secrets.SWA_ORIGIN_VERIFY }}
        run: scripts/write-origin-lock.sh dist

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_DEPLOYMENT_TOKEN_PROD }}
          action: upload
          app_location: dist
          # We build above with a pinned Node version rather than letting Oryx do it,
          # so the deploy step only uploads. Oryx would otherwise re-run its own build
          # on an unpinned toolchain, which can differ from what CI just verified.
          skip_app_build: true
          skip_api_build: true

      # Without this the workflow ends at "upload succeeded" and nothing ever checks the
      # site answers. The why, and the exit conditions, are in the script — which is a
      # script precisely so the tests can drive it against a stub instead of asserting
      # that this YAML mentions the right URLs. A review showed that inline, all three
      # of its failure branches could be replaced with an echo and the suite stayed
      # green: the detection mechanism itself was undetectably removable.
      #
      # This step runs AFTER the upload, so a failure here does not prevent the release —
      # the artifact is already live and this job cannot roll it back. That is deliberate:
      # the lock can only be tested against the real Standard-tier origin, which no
      # earlier stage has. Its job is to make a broken lock loud within a minute rather
      # than silent forever, and to hand whoever reads the log the fast recovery path.
      - name: Verify the lock from both sides
        env:
          # Azure's permanent default hostname for swa-packsheet-prod. Public already, so
          # not a secret. It only changes if the Static Web App itself is recreated.
          AZURE_HOSTNAME: wonderful-island-05575f303.7.azurestaticapps.net
        run: scripts/verify-origin-lock.sh https://packsheet.io "https://$AZURE_HOSTNAME"
