name: Deploy production

# main is only ever updated by merging staging through a pull request, so a push here
# means a release. It deploys to the packsheet-io Worker, which serves packsheet.io.
#
# That promotion uses a merge commit, deliberately. GitHub's other two strategies both
# rewrite commits, which re-creates the change under a new SHA; the branches then
# diverge and the next release fails with an add/add conflict that looks like a content
# problem but is a history one. This happened once, during the PS-7 release. Linear
# history is therefore NOT required on main — it would leave only the two rewriting
# strategies and guarantee the fault returns.
#
# What used to live here and no longer needs to: the origin lock. Azure published every
# Static Web App on a permanent *.azurestaticapps.net hostname that could not be turned
# off, served the same build as the custom domain, and bypassed Cloudflare entirely —
# so production had to write a forwardingGateway config demanding a header that a
# Cloudflare transform rule set, then verify from both sides after every release. On
# Workers, `workers_dev: false` in wrangler.jsonc means the second hostname is never
# created. There is nothing to lock, so there is nothing to verify. See Ref 46.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  # NOT cancel-in-progress. You cannot cancel an upload that has already happened: a run
  # cancelled part-way leaves a live release nobody watched go out, shown as a grey
  # "cancelled" rather than a failure, with no notification.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    # Scopes the API token to this environment rather than the whole repo, so a
    # workflow running from a fork or a feature branch cannot reach it.
    environment:
      name: production
      url: https://packsheet.io
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Ahead of `npm test`, not just ahead of the migration push. Part of the suite
      # queries a real database as the `anon` and `authenticated` roles, and it fails
      # rather than skips when there is not one — so without this the deploy stops here,
      # before it pushes migrations or builds anything.
      #
      # There is a second reason it belongs in a DEPLOY workflow specifically: the step
      # below is about to `db push` these exact migrations to a hosted project. Replaying
      # them into an empty local database and running the policy tests against the result
      # is the closest thing to a rehearsal this pipeline can have, and it happens before
      # anything irreversible.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      - uses: ./.github/actions/local-database

      # Runs here as well as in ci.yml, on purpose. This workflow and CI are both
      # triggered by the same push and neither depends on the other, so a red CI does
      # not stop a deploy — it is not a race that usually resolves safely, it is no
      # gate at all. The required status check protects the merge button; this step is
      # what protects the artifact.
      #
      # This is the last gate before production. Nothing downstream re-checks.
      - run: npm test

      # Before the build and before the deploy, so the schema a release needs is in
      # place by the time that release can serve a request against it. See the same
      # step in deploy-staging.yml — which, because staging is always merged to main
      # rather than the other way round, has already run every one of these
      # migrations against a real Postgres before this workflow sees them.
      # No SUPABASE_DB_PASSWORD — see deploy-staging.yml. The CLI provisions its own
      # login role from the access token.
      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        # Through scripts/supabase.sh, not `supabase` directly. This job never starts a
        # local stack, but `link` and `db push` still PARSE supabase/config.toml, and
        # that file reads its project name and ports from the environment so each git
        # worktree gets its own Docker containers. Unset, they make the whole file fail
        # to parse with "ProjectConfigParseError" — a release broken by a local-dev
        # convenience, with an error naming neither.
        run: |
          set -euo pipefail
          scripts/supabase.sh link --project-ref "$PROJECT_REF"
          scripts/supabase.sh db push

      - name: Build
        env:
          # PUBLIC_SITE_ENV drives robots.txt. Only the literal string "production"
          # produces an indexable site — see src/pages/robots.txt.ts.
          PUBLIC_SITE_ENV: production

          # Selects which block of wrangler.jsonc applies, at BUILD time. Dropping
          # this line does not fail — wrangler.jsonc has a top level that would serve
          # as a default — which is exactly why it is set explicitly and asserted in
          # tests/deploy-workers.test.ts. The failure that costs something is the
          # mirror image of it, in deploy-staging.yml.
          CLOUDFLARE_ENV: production

          # PK-19: build-time inputs Vite inlines into the client bundle at this step —
          # see the identical comment in deploy-staging.yml. Production's own
          # environment-scoped secrets, distinct from staging's: separate Supabase
          # project, separate URL, separate key. See the README's "Database" section.
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

          # Off (this secret unset, or anything other than the literal "true") until a
          # Google Cloud OAuth client exists AND the provider is switched on in
          # production's own Supabase project — see .env.example and
          # src/lib/auth-routes.ts (GOOGLE_AUTH_ENABLED). Same build-time mechanism as
          # the pair above: whichever way this resolves is compiled into the artifact
          # here, not decided later.
          PUBLIC_GOOGLE_AUTH_ENABLED: ${{ secrets.PUBLIC_GOOGLE_AUTH_ENABLED }}
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned to package-lock.json's wrangler. See deploy-staging.yml.
          wranglerVersion: '4.120.0'
          command: deploy -c dist/server/wrangler.json

      # The upload reporting success is not the same as the site answering, and this is
      # the one deploy nobody gets to re-run casually. A release that builds, uploads
      # and then serves a 500 would otherwise show as a green tick.
      #
      # After the deploy, so a failure here cannot roll anything back — the artifact is
      # already live. Its job is to make a broken release loud within a minute rather
      # than silent until someone visits.
      #
      # A script, not an inline block, and that is the whole point. Inline, every one
      # of its conditions could be inverted or replaced with an `echo` and the suite
      # stayed green — a review demonstrated exactly that by flipping the robots check,
      # producing a step that fails every correct release and passes silently when a
      # staging build is live on packsheet.io. As a script it is executed against stub
      # origins in tests/deploy-workers.test.ts, which is the same lesson the deleted
      # origin-lock verifier learnt twice.
      #
      # Bounded: unbounded retries can otherwise spend twenty minutes going red, all of
      # it after the release is already live.
      - name: Verify the release answers
        env:
          SITE: https://packsheet.io
        timeout-minutes: 5
        run: scripts/verify-release.sh "$SITE"
