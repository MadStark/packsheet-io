name: Deploy production

# main is only ever updated by merging staging through a pull request, so a push here
# means a release. Production is the Standard-tier Static Web App.
#
# That promotion uses a merge commit, deliberately. GitHub's other two strategies both
# rewrite commits, which re-creates the change under a new SHA; the branches then
# diverge and the next release fails with an add/add conflict that looks like a content
# problem but is a history one. This happened once, during the PS-7 release. Linear
# history is therefore NOT required on main — it would leave only the two rewriting
# strategies and guarantee the fault returns.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    # Scopes the deployment token to this environment rather than the whole repo,
    # so a workflow running from a fork or a feature branch cannot reach it.
    environment:
      name: production
      url: https://packsheet.io
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Runs here as well as in ci.yml, on purpose. This workflow and CI are both
      # triggered by the same push and neither depends on the other, so a red CI does
      # not stop a deploy — it is not a race that usually resolves safely, it is no
      # gate at all. The required status check protects the merge button; this step is
      # what protects the artifact. Costs ~25s and must stay ahead of the build.
      #
      # This is the last gate before production. Nothing downstream re-checks.
      - run: npm test

      - name: Build
        # PUBLIC_SITE_ENV drives robots.txt. Only the literal string "production"
        # produces an indexable site — see src/pages/robots.txt.ts.
        env:
          PUBLIC_SITE_ENV: production
        run: npm run build

      # Azure gives every Static Web App a permanent, public *.azurestaticapps.net
      # hostname. It cannot be disabled, it serves this exact build, and it bypasses
      # Cloudflare completely — no edge cache, no WAF, no rate limiting, and a second
      # crawlable copy of every page we publish.
      #
      # staticwebapp.config.json cannot fix that on its own: route rules match on
      # `route` and `methods` only, never on hostname, and globalHeaders apply to every
      # response. So there is no way to serve a noindex header on the Azure hostname
      # without also serving it on packsheet.io and deindexing the real site.
      #
      # Instead the origin refuses anything that did not arrive through Cloudflare. A
      # Cloudflare request-header transform sets X-Origin-Verify on every request to the
      # origin; forwardingGateway.requiredHeaders makes Azure demand it and answer 403
      # otherwise. The Cloudflare rule must exist BEFORE this ships — it does.
      #
      # Written here rather than committed because this repository is public and the
      # value must not be. Production-only on purpose: forwardingGateway requires the
      # Standard plan and staging is deliberately Free, so staging gets no such file.
      # That is the second environment-dependent behaviour in the project, and unlike
      # PUBLIC_SITE_ENV it cannot be reproduced on staging. See the README.
      # The logic lives in a script so the tests can execute it. Asserting on this YAML
      # instead let both outage-causing mutations pass a green suite: a wrong output
      # directory (config never uploaded, lock never applied) and a misspelt header name
      # (production refuses every request). The script's argument must stay in step with
      # app_location below — tests/deploy-origin-lock.test.ts pins that they agree.
      - name: Write the production-only origin lock
        env:
          ORIGIN_VERIFY: ${{ secrets.SWA_ORIGIN_VERIFY }}
        run: scripts/write-origin-lock.sh dist

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_DEPLOYMENT_TOKEN_PROD }}
          action: upload
          app_location: dist
          # We build above with a pinned Node version rather than letting Oryx do it,
          # so the deploy step only uploads. Oryx would otherwise re-run its own build
          # on an unpinned toolchain, which can differ from what CI just verified.
          skip_app_build: true
          skip_api_build: true

      # Without this the workflow ends at "upload succeeded" and nothing ever checks the
      # site answers. The origin lock depends on a Cloudflare transform rule that lives
      # outside this repository: if it is edited, disabled, narrowed, or a record is
      # grey-clouded, every uncached request 403s and CI, the deploy and the environment
      # all still report green. Time to detection would be "a human loads the site".
      #
      # This is also the only check that runs against the real Standard-tier behaviour —
      # staging is Free and cannot host forwardingGateway, so nothing upstream exercises
      # it. It is the compensating control for a change that cannot be rehearsed.
      - name: Verify the lock from both sides
        env:
          # Azure's permanent default hostname for swa-packsheet-prod. Public already, so
          # not a secret. It only changes if the Static Web App itself is recreated.
          AZURE_HOSTNAME: wonderful-island-05575f303.7.azurestaticapps.net
        run: |
          # Retry the happy path: a deploy takes a moment to become visible at the edge,
          # and a flaky first request must not be reported as an outage.
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 6 --retry-delay 5 --retry-all-errors https://packsheet.io/)
          if [ "$status" != "200" ]; then
            echo "::error::packsheet.io returned $status, expected 200. If this is 403, Cloudflare is not sending X-Origin-Verify — restore the transform rule (fast) rather than reverting the deploy (slow)."
            exit 1
          fi

          # Assert "not 200" rather than "== 403": the Azure docs never state which status
          # a missing required header produces, so pinning 403 would encode a guess.
          azure_status=$(curl -sS -o /dev/null -w '%{http_code}' "https://$AZURE_HOSTNAME/")
          if [ "$azure_status" = "200" ]; then
            echo "::error::$AZURE_HOSTNAME still returns 200 — the origin lock is NOT in effect. The config did not reach the artifact, or forwardingGateway was not applied."
            exit 1
          fi

          # This deploy is the first thing to put a secret inside dist/. Static Web Apps
          # is expected to consume staticwebapp.config.json rather than serve it; if that
          # assumption is ever wrong, the secret is published at a stable public URL.
          cfg_status=$(curl -sS -o /dev/null -w '%{http_code}' https://packsheet.io/staticwebapp.config.json)
          if [ "$cfg_status" = "200" ]; then
            echo "::error::staticwebapp.config.json is being SERVED at packsheet.io. The origin-verify secret is public — rotate it immediately."
            exit 1
          fi

          echo "packsheet.io=$status  $AZURE_HOSTNAME=$azure_status  config=$cfg_status"
