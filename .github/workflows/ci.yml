name: CI

# Runs on every pull request, and on direct pushes to the two long-lived branches.
# The `check` job is registered as a required status check on both branches, so its
# name is load-bearing — renaming the job breaks branch protection silently, and PRs
# will sit waiting for a check that can never report.

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read from .nvmrc rather than pinned inline, so CI and a contributor's local
      # runtime cannot drift apart silently — there is one place to change the Node
      # version, and every workflow follows it. The same applies to the three deploy
      # workflows, which build the artifacts that actually ship.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` not `npm install` — it installs exactly the lockfile and fails if
      # package.json and the lockfile have drifted, which is the behaviour we want here.
      - run: npm ci

      # astro check + tsc --noEmit + eslint + prettier --check.
      - run: npm run check

      # Every file under src/pages becomes a route, so a test file there would ship as
      # a page. Vitest also excludes that directory, so such a test would never run —
      # a green CI for a test that cannot fail. Caught here rather than left to a
      # comment, because the failure is silent in both directions.
      - name: Reject test files under src/pages
        run: |
          if find src/pages -type f \( -name '*.test.*' -o -name '*.spec.*' \) | grep -q .; then
            echo "::error::Test files must not live under src/pages/ — they become routes. Move them to tests/."
            find src/pages -type f \( -name '*.test.*' -o -name '*.spec.*' \)
            exit 1
          fi

      # The row-level-security tests need a real Postgres, because a policy is a SQL
      # expression and the only thing that can say what it does is Postgres evaluating
      # it as the `anon` role. They do not skip when there is no database — they fail —
      # so this step is what stands between that and a red build on every PR.
      #
      # Deliberately in THIS job rather than a new one. `check` is the registered
      # required status check on main and staging; a separate `database` job would
      # report without blocking until somebody added it to branch protection by hand,
      # and Ref 49's acceptance criterion is specifically that a table without RLS
      # "fails the build rather than shipping". A guardrail that runs but cannot block
      # is the failure mode this repository keeps writing tests against.
      #
      # Pinned to the same CLI version as the two deploy workflows, so the migrations
      # replayed here and the migrations pushed to a hosted project are applied by the
      # same tool.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      # `supabase start` applies every migration in order against an empty database on
      # the way up, which makes this step the same check as `supabase db reset` locally:
      # it proves the migrations run from clean, not merely against whatever state a
      # machine happens to be in.
      - name: Start the local database
        run: supabase start

      # `supabase start` is not a readiness check, and its exit code is not evidence.
      # Verified locally: with the PostgREST and Auth containers stopped it prints the
      # full env block, exits 0, and does NOT bring them back. The tests would then die
      # on hook timeouts in two files while a third passed, and the summary would read
      # "18 skipped" — the exact reporting shape this suite exists to eliminate.
      #
      # So the readiness assertion is explicit and fails at the step that caused it,
      # with a name attached, instead of surfacing three jobs later as a test failure.
      # `--fail` matters: curl exits 0 on a 4xx/5xx body without it.
      - name: Wait for the database and the Data API
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null "$API_URL/rest/v1/" -H "apikey: $ANON_KEY"; then
              echo "Data API ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::The Supabase Data API never became ready; the RLS tests cannot run."
          supabase status
          exit 1

      # Vitest, kept as its own step rather than folded into `npm run check` so the
      # static checks and the tests fail distinguishably in the log. Both run in this
      # one job on purpose — `check` is the required status check on main and staging,
      # so anything that must block a merge has to report through it.
      - run: npm test
