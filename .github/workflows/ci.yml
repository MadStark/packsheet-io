name: CI

# Runs on every pull request, and on direct pushes to the two long-lived branches.
# The `check` job is registered as a required status check on both branches, so its
# name is load-bearing — renaming the job breaks branch protection silently, and PRs
# will sit waiting for a check that can never report.

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read from .nvmrc rather than pinned inline, so CI and a contributor's local
      # runtime cannot drift apart silently — there is one place to change the Node
      # version, and every workflow follows it. The same applies to the three deploy
      # workflows, which build the artifacts that actually ship.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` not `npm install` — it installs exactly the lockfile and fails if
      # package.json and the lockfile have drifted, which is the behaviour we want here.
      - run: npm ci

      # astro check + tsc --noEmit + eslint + prettier --check.
      - run: npm run check

      # Every file under src/pages becomes a route, so a test file there would ship as
      # a page. Vitest also excludes that directory, so such a test would never run —
      # a green CI for a test that cannot fail. Caught here rather than left to a
      # comment, because the failure is silent in both directions.
      - name: Reject test files under src/pages
        run: |
          if find src/pages -type f \( -name '*.test.*' -o -name '*.spec.*' \) | grep -q .; then
            echo "::error::Test files must not live under src/pages/ — they become routes. Move them to tests/."
            find src/pages -type f \( -name '*.test.*' -o -name '*.spec.*' \)
            exit 1
          fi

      # Vitest, kept as its own step rather than folded into `npm run check` so the
      # static checks and the tests fail distinguishably in the log. Both run in this
      # one job on purpose — `check` is the required status check on main and staging,
      # so anything that must block a merge has to report through it.
      - run: npm test
